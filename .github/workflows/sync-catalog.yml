name: Sync LeetCode catalog
on:
  schedule: [{ cron: "0 3 * * 1" }] # Mondays 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
# Commits to dev, so the catalog ships with the next release instead of deploying on its own.
jobs:
  sync:
    if: github.repository == 'jammutkarsh/recursify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev }
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/sync-catalog.ts
      - run: |
          git diff --quiet src/data/leetcode.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync LeetCode catalog" && git push
